  #     postgres:
  #       condition: service_healthy
  #   volumes:
  #     - ./backend:/app
  #     - /app/node_modules
  #     - /app/dist
  #   command: pnpm start:dev
  #   networks:
  #     - epitrello-network-dev

  # Frontend in development mode with hot-reload
  # Uncomment if you want to run the frontend in Docker
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #     target: base
  #   container_name: epitrello-frontend-dev
  #   restart: unless-stopped
  #   environment:
  #     NODE_ENV: development
  #     NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
  #   ports:
  #     - "${FRONTEND_PORT}:3000"
  #   depends_on:
  #     - backend
  #   volumes:
  #     - ./frontend:/app
  #     - /app/node_modules
  #     - /app/.next
  #   command: pnpm dev
  #   networks:
  #     - epitrello-network-dev

volumes:
  postgres_data_dev:

networks:
  epitrello-network-dev:
    driver: bridge

