name: Cleanup & Cost Management

on:
  schedule:
    - cron: '0 2 * * *' # Daily at 2 AM UTC
  workflow_dispatch:

env:
  GCP_REGION: europe-west1

jobs:
  cleanup-app-engine:
    name: Cleanup App Engine Versions
    runs-on: ubuntu-latest

    steps:
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: List old App Engine versions
        run: |
          gcloud app versions list --format="table(id,service,traffic_split,version.createTime)" --filter="traffic_split=0.0"

      - name: Delete old App Engine versions
        run: |
          OLD_VERSIONS=$(gcloud app versions list --format="value(id)" --filter="traffic_split=0.0" --limit=10)
          if [ -n "$OLD_VERSIONS" ]; then
            echo "$OLD_VERSIONS" | xargs -I {} gcloud app versions delete {} --quiet || true
          fi

  cleanup-storage:
    name: Cleanup Cloud Storage
    runs-on: ubuntu-latest

    steps:
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: List old objects
        run: |
          gsutil ls -l gs://${{ secrets.GCP_PROJECT_ID }}-epitrello-storage/ | head -20

      - name: Delete old objects (older than 90 days)
        run: |
          gsutil -m rm -r gs://${{ secrets.GCP_PROJECT_ID }}-epitrello-storage/** || true

  cost-report:
    name: Generate Cost Report
    runs-on: ubuntu-latest

    steps:
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Get billing account
        id: billing
        run: |
          BILLING_ACCOUNT=$(gcloud billing accounts list --format="value(name)" --limit=1)
          echo "billing_account=$BILLING_ACCOUNT" >> $GITHUB_OUTPUT

      - name: Generate cost report
        run: |
          echo "## Cost Report - $(date +%Y-%m-%d)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Resources" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY

          # Count Cloud Run services
          RUN_SERVICES=$(gcloud run services list --format="value(name)" | wc -l)
          echo "| Cloud Run | $RUN_SERVICES |" >> $GITHUB_STEP_SUMMARY

          # Count Cloud SQL instances
          SQL_INSTANCES=$(gcloud sql instances list --format="value(name)" | wc -l)
          echo "| Cloud SQL | $SQL_INSTANCES |" >> $GITHUB_STEP_SUMMARY

          # Count App Engine versions
          APP_VERSIONS=$(gcloud app versions list --format="value(id)" | wc -l)
          echo "| App Engine Versions | $APP_VERSIONS |" >> $GITHUB_STEP_SUMMARY

  identify-unused-resources:
    name: Identify Unused Resources
    runs-on: ubuntu-latest

    steps:
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Identify unused resources
        run: |
          echo "## Unused Resources Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Recommendations" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Review App Engine versions with 0% traffic" >> $GITHUB_STEP_SUMMARY
          echo "- Check Cloud Storage objects older than 90 days" >> $GITHUB_STEP_SUMMARY
          echo "- Review Cloud Run services with 0 requests" >> $GITHUB_STEP_SUMMARY

  notify:
    name: Send Notification
    runs-on: ubuntu-latest
    needs:
      [
        cleanup-app-engine,
        cleanup-storage,
        cost-report,
        identify-unused-resources,
      ]
    if: always()

    steps:
      - name: Notification
        run: |
          # Add Slack/Discord notification here if needed
