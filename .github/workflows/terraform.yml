name: Terraform CI/CD

on:
  workflow_call:
    inputs:
      environment:
        description: Environment to deploy to
        required: true
        type: string
      is_pull_request:
        description: Indicates if the caller is a pull request
        required: true
        type: boolean
    secrets:
      GCP_PROJECT_ID:
        required: true
      GCP_WORKLOAD_IDENTITY_PROVIDER:
        required: true
      GCP_SERVICE_ACCOUNT:
        required: true
      DB_NAME:
        required: true
      DB_USER:
        required: true
      DB_PASSWORD:
        required: true
      JWT_SECRET:
        required: true
      RESEND_API_KEY:
        required: true
      GOOGLE_CLIENT_ID:
        required: false
      GOOGLE_CLIENT_SECRET:
        required: false
      MICROSOFT_CLIENT_ID:
        required: false
      MICROSOFT_CLIENT_SECRET:
        required: false
      APPLE_CLIENT_ID:
        required: false
      APPLE_CLIENT_SECRET:
        required: false
      SLACK_CLIENT_ID:
        required: false
      SLACK_CLIENT_SECRET:
        required: false

env:
  TF_VERSION: '1.6.0'
  TF_WORKING_DIR: ./terraform
  GCP_REGION: europe-west1

jobs:
  terraform-validate:
    name: Validate Terraform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: terraform-validate
    if: inputs.is_pull_request == false
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Setup GCP Authentication
        uses: ./.github/actions/setup-gcp-auth
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -upgrade

      - name: Setup Terraform variables
        uses: ./.github/actions/setup-terraform-vars
        with:
          environment: ${{ inputs.environment }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          region: ${{ env.GCP_REGION }}
          db_name: ${{ secrets.DB_NAME }}
          db_user: ${{ secrets.DB_USER }}
          db_password: ${{ secrets.DB_PASSWORD }}
          jwt_secret: ${{ secrets.JWT_SECRET }}
          resend_api_key: ${{ secrets.RESEND_API_KEY }}
          google_client_id: ${{ secrets.GOOGLE_CLIENT_ID }}
          google_client_secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          microsoft_client_id: ${{ secrets.MICROSOFT_CLIENT_ID }}
          microsoft_client_secret: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          apple_client_id: ${{ secrets.APPLE_CLIENT_ID }}
          apple_client_secret: ${{ secrets.APPLE_CLIENT_SECRET }}
          slack_client_id: ${{ secrets.SLACK_CLIENT_ID }}
          slack_client_secret: ${{ secrets.SLACK_CLIENT_SECRET }}

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          export TF_LOG=INFO
          export TF_LOG_PATH=/tmp/terraform.log
          source /tmp/terraform_vars.sh
          terraform plan -out=tfplan \
            -parallelism=10 \
            -refresh=false \
            "${TF_VARS[@]}"
        timeout-minutes: 25

      - name: Save plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ inputs.environment }}
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          retention-days: 1

  terraform-apply:
    name: Apply Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: terraform-plan
    if: inputs.is_pull_request == false
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-${{ inputs.environment }}
          path: ${{ env.TF_WORKING_DIR }}

      - name: Validate required secrets
        shell: bash
        run: |
          if [ -z "${{ secrets.DB_NAME }}" ]; then
            echo "ERROR: DB_NAME secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.DB_USER }}" ]; then
            echo "ERROR: DB_USER secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.DB_PASSWORD }}" ]; then
            echo "ERROR: DB_PASSWORD secret is not set"
            exit 1
          fi

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Setup Terraform variables
        uses: ./.github/actions/setup-terraform-vars
        with:
          environment: ${{ inputs.environment }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          region: ${{ env.GCP_REGION }}
          db_name: ${{ secrets.DB_NAME }}
          db_user: ${{ secrets.DB_USER }}
          db_password: ${{ secrets.DB_PASSWORD }}
          jwt_secret: ${{ secrets.JWT_SECRET }}
          resend_api_key: ${{ secrets.RESEND_API_KEY }}
          google_client_id: ${{ secrets.GOOGLE_CLIENT_ID }}
          google_client_secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          microsoft_client_id: ${{ secrets.MICROSOFT_CLIENT_ID }}
          microsoft_client_secret: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          apple_client_id: ${{ secrets.APPLE_CLIENT_ID }}
          apple_client_secret: ${{ secrets.APPLE_CLIENT_SECRET }}
          slack_client_id: ${{ secrets.SLACK_CLIENT_ID }}
          slack_client_secret: ${{ secrets.SLACK_CLIENT_SECRET }}

      - name: Import existing Terraform state bucket if needed
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          source /tmp/terraform_vars.sh
          if ! terraform state show google_storage_bucket.terraform_state >/dev/null 2>&1; then
            terraform import "${TF_VARS[@]}" \
              google_storage_bucket.terraform_state epitrello-terraform-state 2>/dev/null || true
          fi

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          source /tmp/terraform_vars.sh
          terraform apply -auto-approve tfplan 2>&1 | tee /tmp/apply.log || {
            if grep -q "Saved plan is stale" /tmp/apply.log; then
              terraform refresh "${TF_VARS[@]}" || true
              terraform plan -out=tfplan -parallelism=10 -refresh=true "${TF_VARS[@]}"
              terraform apply -auto-approve tfplan || exit 1
            elif grep -q "Your previous request to create the named bucket succeeded" /tmp/apply.log; then
              terraform import "${TF_VARS[@]}" \
                google_storage_bucket.terraform_state epitrello-terraform-state || true
              terraform apply -auto-approve tfplan || exit 1
            else
              exit 1
            fi
          }
