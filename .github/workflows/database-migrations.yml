name: Database Migrations

on:
  push:
    branches: [master]
    paths:
      - 'backend/prisma/migrations/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        required: true
        type: choice
        options:
          - staging
          - production
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - status
          - deploy
          - reset

env:
  GCP_REGION: europe-west1

jobs:
  detect-migrations:
    name: Detect Migrations
    runs-on: ubuntu-latest
    outputs:
      has_migrations: ${{ steps.check.outputs.has_migrations }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for migrations
        id: check
        run: |
          if [ -d "backend/prisma/migrations" ] && [ "$(ls -A backend/prisma/migrations)" ]; then
            echo "has_migrations=true" >> $GITHUB_OUTPUT
          else
            echo "has_migrations=false" >> $GITHUB_OUTPUT
          fi

  migration-status:
    name: Migration Status
    runs-on: ubuntu-latest
    needs: detect-migrations
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'status'
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Backend
        uses: ./.github/actions/setup-backend

      - name: Get database connection
        id: db
        run: |
          ENV=${{ github.event.inputs.environment }}
          INSTANCE="${ENV}-epitrello-db"
          CONNECTION_NAME=$(gcloud sql instances describe $INSTANCE --format="value(connectionName)")
          echo "connection_name=$CONNECTION_NAME" >> $GITHUB_OUTPUT

      - name: Check migration status
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          pnpm prisma migrate status

  deploy-migrations:
    name: Deploy Migrations
    runs-on: ubuntu-latest
    needs: detect-migrations
    if: |
      (github.event_name == 'push' && needs.detect-migrations.outputs.has_migrations == 'true') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy')
    environment: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Backend
        uses: ./.github/actions/setup-backend

      - name: Get database connection
        id: db
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            ENV=${{ github.event.inputs.environment }}
          elif [ "${{ github.ref }}" == "refs/heads/master" ]; then
            ENV="production"
          else
            ENV="staging"
          fi
          INSTANCE="${ENV}-epitrello-db"
          CONNECTION_NAME=$(gcloud sql instances describe $INSTANCE --format="value(connectionName)")
          echo "connection_name=$CONNECTION_NAME" >> $GITHUB_OUTPUT
          echo "environment=$ENV" >> $GITHUB_OUTPUT

      - name: Deploy migrations
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          pnpm prisma migrate deploy

      - name: Verify migrations
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          pnpm prisma migrate status

  reset-database:
    name: Reset Database
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'reset' && github.event.inputs.environment == 'staging'
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Backend
        uses: ./.github/actions/setup-backend

      - name: Reset database
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          pnpm prisma migrate reset --force
