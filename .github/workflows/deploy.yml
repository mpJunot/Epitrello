name: Deploy to GCP

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - staging
          - production

env:
  TF_VERSION: '1.6.0'
  TF_WORKING_DIR: ./terraform
  GCP_REGION: europe-west1

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      terraform: ${{ steps.filter.outputs.terraform }}
      environment: ${{ steps.env.outputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect environment
        id: env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/master" ]; then
            echo "environment=production" >> $GITHUB_OUTPUT
          else
            echo "environment=staging" >> $GITHUB_OUTPUT
          fi

      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@v2
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/deploy.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/deploy.yml'
            terraform:
              - 'terraform/**'
              - '.github/workflows/deploy.yml'

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.terraform == 'true'

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/epitrello_test?schema=public
      JWT_SECRET: test-secret-key-for-ci
      NODE_ENV: test

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: epitrello_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Backend
        uses: ./.github/actions/setup-backend

      - name: Run backend tests
        working-directory: backend
        run: pnpm test:unit

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.terraform == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Frontend
        uses: ./.github/actions/setup-frontend

      - name: Check for test script
        id: check-test
        working-directory: frontend
        run: |
          if grep -q '"test"' package.json; then
            echo "has_test=true" >> $GITHUB_OUTPUT
          else
            echo "has_test=false" >> $GITHUB_OUTPUT
          fi

      - name: Run frontend tests
        if: steps.check-test.outputs.has_test == 'true'
        working-directory: frontend
        run: pnpm test

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: detect-changes
    if: always() && (needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.frontend == 'true')
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  terraform-validate:
    name: Validate Terraform
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.terraform == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

  build-backend:
    name: Build Backend Docker Image
    runs-on: ubuntu-latest
    needs: [detect-changes, test-backend]
    if: needs.detect-changes.outputs.backend == 'true' && (needs.test-backend.result == 'success' || needs.test-backend.result == 'skipped')
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup GCP Authentication
        uses: ./.github/actions/setup-gcp-auth
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: gcr.io/${{ secrets.GCP_PROJECT_ID }}/epitrello-backend
          tags: |
            type=sha,format=long
            type=raw,value=${{ github.ref_name }}-${{ github.sha }},enable=true
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    name: Build Frontend Docker Image
    runs-on: ubuntu-latest
    needs: [detect-changes, test-frontend]
    if: needs.detect-changes.outputs.frontend == 'true' && (needs.test-frontend.result == 'success' || needs.test-frontend.result == 'skipped')
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup GCP Authentication
        uses: ./.github/actions/setup-gcp-auth
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Get Backend URL for build
        id: backend-url
        uses: ./.github/actions/get-backend-url
        with:
          environment: ${{ needs.detect-changes.outputs.environment }}
          region: ${{ env.GCP_REGION }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          production_api_url: ${{ secrets.PRODUCTION_API_URL }}
          staging_api_url: ${{ secrets.STAGING_API_URL }}

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: gcr.io/${{ secrets.GCP_PROJECT_ID }}/epitrello-frontend
          tags: |
            type=sha,format=long
            type=raw,value=${{ github.ref_name }}-${{ github.sha }},enable=true
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ steps.backend-url.outputs.url }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [detect-changes, terraform-validate]
    if: needs.detect-changes.outputs.terraform == 'true' && needs.terraform-validate.result == 'success'
    environment: ${{ needs.detect-changes.outputs.environment }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Setup GCP Authentication
        uses: ./.github/actions/setup-gcp-auth
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -upgrade

      - name: Setup Terraform variables
        uses: ./.github/actions/setup-terraform-vars
        with:
          environment: ${{ needs.detect-changes.outputs.environment }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          region: ${{ env.GCP_REGION }}
          db_name: ${{ secrets.DB_NAME }}
          db_user: ${{ secrets.DB_USER }}
          db_password: ${{ secrets.DB_PASSWORD }}
          jwt_secret: ${{ secrets.JWT_SECRET }}
          resend_api_key: ${{ secrets.RESEND_API_KEY }}
          google_client_id: ${{ secrets.GOOGLE_CLIENT_ID }}
          google_client_secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          microsoft_client_id: ${{ secrets.MICROSOFT_CLIENT_ID }}
          microsoft_client_secret: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          apple_client_id: ${{ secrets.APPLE_CLIENT_ID }}
          apple_client_secret: ${{ secrets.APPLE_CLIENT_SECRET }}
          slack_client_id: ${{ secrets.SLACK_CLIENT_ID }}
          slack_client_secret: ${{ secrets.SLACK_CLIENT_SECRET }}

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          export TF_LOG=INFO
          export TF_LOG_PATH=/tmp/terraform.log
          source /tmp/terraform_vars.sh
          terraform plan -out=tfplan \
            -parallelism=10 \
            -refresh=false \
            "${TF_VARS[@]}"
        timeout-minutes: 25

      - name: Save plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ needs.detect-changes.outputs.environment }}
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          retention-days: 1

  terraform-apply:
    name: Apply Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [detect-changes, terraform-plan]
    if: github.event_name != 'pull_request' && needs.detect-changes.outputs.terraform == 'true' && needs.terraform-plan.result == 'success'
    environment: ${{ needs.detect-changes.outputs.environment }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-${{ needs.detect-changes.outputs.environment }}
          path: ${{ env.TF_WORKING_DIR }}

      - name: Validate required secrets
        shell: bash
        run: |
          if [ -z "${{ secrets.DB_NAME }}" ]; then
            echo "ERROR: DB_NAME secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.DB_USER }}" ]; then
            echo "ERROR: DB_USER secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.DB_PASSWORD }}" ]; then
            echo "ERROR: DB_PASSWORD secret is not set"
            exit 1
          fi
          echo "All required database secrets are set"

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Setup Terraform variables
        uses: ./.github/actions/setup-terraform-vars
        with:
          environment: ${{ needs.detect-changes.outputs.environment }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          region: ${{ env.GCP_REGION }}
          db_name: ${{ secrets.DB_NAME }}
          db_user: ${{ secrets.DB_USER }}
          db_password: ${{ secrets.DB_PASSWORD }}
          jwt_secret: ${{ secrets.JWT_SECRET }}
          resend_api_key: ${{ secrets.RESEND_API_KEY }}
          google_client_id: ${{ secrets.GOOGLE_CLIENT_ID }}
          google_client_secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          microsoft_client_id: ${{ secrets.MICROSOFT_CLIENT_ID }}
          microsoft_client_secret: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          apple_client_id: ${{ secrets.APPLE_CLIENT_ID }}
          apple_client_secret: ${{ secrets.APPLE_CLIENT_SECRET }}
          slack_client_id: ${{ secrets.SLACK_CLIENT_ID }}
          slack_client_secret: ${{ secrets.SLACK_CLIENT_SECRET }}

      - name: Import existing Terraform state bucket if needed
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          source /tmp/terraform_vars.sh
          # Check if bucket exists and is not in state
          if terraform state show google_storage_bucket.terraform_state >/dev/null 2>&1; then
            echo "Bucket already in Terraform state"
          else
            echo "Attempting to import existing bucket..."
            terraform import "${TF_VARS[@]}" \
              google_storage_bucket.terraform_state epitrello-terraform-state 2>/dev/null || {
              echo "Bucket import failed or bucket doesn't exist, will be created"
            }
          fi

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          source /tmp/terraform_vars.sh
          terraform apply -auto-approve tfplan 2>&1 | tee /tmp/apply.log || {
            if grep -q "Saved plan is stale" /tmp/apply.log; then
              echo "Plan is stale, regenerating..."
              terraform refresh "${TF_VARS[@]}" || true
              terraform plan -out=tfplan -parallelism=10 -refresh=true "${TF_VARS[@]}"
              terraform apply -auto-approve tfplan || exit 1
            elif grep -q "Your previous request to create the named bucket succeeded" /tmp/apply.log; then
              echo "Bucket already exists, importing..."
              terraform import "${TF_VARS[@]}" \
                google_storage_bucket.terraform_state epitrello-terraform-state || true
              terraform apply -auto-approve tfplan || exit 1
            else
              echo "Apply failed, see logs above"
              exit 1
            fi
          }

  run-migrations:
    name: Run Database Migrations
    runs-on: ubuntu-latest
    needs: [detect-changes, terraform-apply]
    if: github.event_name != 'pull_request' && needs.terraform-apply.result == 'success'
    environment: ${{ needs.detect-changes.outputs.environment }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run migrations
        uses: ./.github/actions/run-migrations
        with:
          environment: ${{ needs.detect-changes.outputs.environment }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          db_password: ${{ secrets.DB_PASSWORD }}

  deploy-backend:
    name: Deploy Backend to Cloud Run
    runs-on: ubuntu-latest
    needs: [detect-changes, build-backend, terraform-apply, run-migrations]
    if: github.event_name != 'pull_request' && needs.detect-changes.outputs.backend == 'true' && needs.build-backend.result == 'success' && needs.terraform-apply.result == 'success' && (needs.run-migrations.result == 'success' || needs.run-migrations.result == 'skipped')
    environment: ${{ needs.detect-changes.outputs.environment }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup GCP Authentication
        uses: ./.github/actions/setup-gcp-auth
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Deploy to Cloud Run
        run: |
          ENV=${{ needs.detect-changes.outputs.environment }}
          IMAGE_TAG="${{ github.ref_name }}-${{ github.sha }}"
          IMAGE="gcr.io/${{ secrets.GCP_PROJECT_ID }}/epitrello-backend:${IMAGE_TAG}"
          SERVICE_NAME="${ENV}-epitrello-backend"

          echo "Deploying image: $IMAGE"
          echo "Service: $SERVICE_NAME"

          gcloud run services update $SERVICE_NAME \
            --image $IMAGE \
            --region ${{ env.GCP_REGION }} \
            --platform managed

  deploy-frontend:
    name: Deploy Frontend to Cloud Run
    runs-on: ubuntu-latest
    needs: [detect-changes, build-frontend, terraform-apply]
    if: github.event_name != 'pull_request' && needs.detect-changes.outputs.frontend == 'true' && needs.build-frontend.result == 'success' && needs.terraform-apply.result == 'success'
    environment: ${{ needs.detect-changes.outputs.environment }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup GCP Authentication
        uses: ./.github/actions/setup-gcp-auth
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Get Backend URL
        id: backend-url
        uses: ./.github/actions/get-backend-url
        with:
          environment: ${{ needs.detect-changes.outputs.environment }}
          region: ${{ env.GCP_REGION }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          production_api_url: ${{ secrets.PRODUCTION_API_URL }}
          staging_api_url: ${{ secrets.STAGING_API_URL }}

      - name: Deploy to Cloud Run
        run: |
          ENV=${{ needs.detect-changes.outputs.environment }}
          IMAGE_TAG="${{ github.ref_name }}-${{ github.sha }}"
          IMAGE="gcr.io/${{ secrets.GCP_PROJECT_ID }}/epitrello-frontend:${IMAGE_TAG}"
          SERVICE_NAME="${ENV}-epitrello-frontend"
          BACKEND_URL="${{ steps.backend-url.outputs.url }}"

          echo "Deploying image: $IMAGE"
          echo "Service: $SERVICE_NAME"
          echo "Backend URL: $BACKEND_URL"

          gcloud run services update $SERVICE_NAME \
            --image $IMAGE \
            --update-env-vars NEXT_PUBLIC_API_URL=$BACKEND_URL \
            --region ${{ env.GCP_REGION }} \
            --platform managed

  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    if: (needs.deploy-backend.result == 'success' || needs.deploy-backend.result == 'skipped') && (needs.deploy-frontend.result == 'success' || needs.deploy-frontend.result == 'skipped')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run smoke tests
        run: |
          # Add actual smoke tests here
          # curl -f ${{ secrets.STAGING_API_URL }}/health || exit 1

  notify:
    name: Notify Deployment
    runs-on: ubuntu-latest
    needs:
      [
        detect-changes,
        terraform-apply,
        run-migrations,
        deploy-backend,
        deploy-frontend,
        smoke-tests,
      ]
    if: always() && (needs.terraform-apply.result == 'success' || needs.terraform-apply.result == 'skipped') && (needs.deploy-backend.result == 'success' || needs.deploy-backend.result == 'skipped') && (needs.deploy-frontend.result == 'success' || needs.deploy-frontend.result == 'skipped')
    environment: ${{ needs.detect-changes.outputs.environment }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Setup GCP Authentication
        uses: ./.github/actions/setup-gcp-auth
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Get Backend URL
        id: backend-url
        uses: ./.github/actions/get-backend-url
        with:
          environment: ${{ needs.detect-changes.outputs.environment }}
          region: ${{ env.GCP_REGION }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Get Frontend URL
        id: frontend-url
        shell: bash
        run: |
          ENV="${{ needs.detect-changes.outputs.environment }}"
          SERVICE_NAME="${ENV}-epitrello-frontend"
          URL=$(gcloud run services describe $SERVICE_NAME \
            --region ${{ env.GCP_REGION }} \
            --project ${{ secrets.GCP_PROJECT_ID }} \
            --format="value(status.url)" 2>/dev/null || echo "")
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Deployment Summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Environment: ${{ needs.detect-changes.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Status | URL |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| Terraform | ${{ needs.terraform-apply.result }} | - |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | ${{ needs.deploy-backend.result }} | ${{ steps.backend-url.outputs.url }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | ${{ needs.deploy-frontend.result }} | ${{ steps.frontend-url.outputs.url }} |" >> $GITHUB_STEP_SUMMARY

      - name: Deployment status
        run: |
          echo "Terraform: ${{ needs.terraform-apply.result }}"
          echo "Backend: ${{ needs.deploy-backend.result }}"
          echo "Frontend: ${{ needs.deploy-frontend.result }}"
