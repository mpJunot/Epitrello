name: Deploy to GCP

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - staging
          - production

env:
  TF_VERSION: '1.6.0'
  TF_WORKING_DIR: ./terraform
  GCP_REGION: europe-west1

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      terraform: ${{ steps.filter.outputs.terraform }}
      environment: ${{ steps.env.outputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect environment
        id: env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/master" ]; then
            echo "environment=production" >> $GITHUB_OUTPUT
          else
            echo "environment=staging" >> $GITHUB_OUTPUT
          fi

      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@v2
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/deploy.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/deploy.yml'
            terraform:
              - 'terraform/**'
              - '.github/workflows/deploy.yml'

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.terraform == 'true'

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/epitrello_test?schema=public
      JWT_SECRET: test-secret-key-for-ci
      NODE_ENV: test

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: epitrello_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Backend
        uses: ./.github/actions/setup-backend

      - name: Run backend tests
        working-directory: backend
        run: pnpm test:unit

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.terraform == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Frontend
        uses: ./.github/actions/setup-frontend

      - name: Check for test script
        id: check-test
        working-directory: frontend
        run: |
          if grep -q '"test"' package.json; then
            echo "has_test=true" >> $GITHUB_OUTPUT
          else
            echo "has_test=false" >> $GITHUB_OUTPUT
          fi

      - name: Run frontend tests
        if: steps.check-test.outputs.has_test == 'true'
        working-directory: frontend
        run: pnpm test

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: detect-changes
    if: always() && (needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.frontend == 'true')
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  terraform:
    name: Terraform
    needs: detect-changes
    if: needs.detect-changes.outputs.terraform == 'true'
    uses: ./.github/workflows/terraform.yml
    with:
      environment: ${{ needs.detect-changes.outputs.environment }}
      is_pull_request: ${{ github.event_name == 'pull_request' }}
    secrets: inherit

  build-backend:
    name: Build Backend Docker Image
    runs-on: ubuntu-latest
    needs: [detect-changes, test-backend]
    if: needs.detect-changes.outputs.backend == 'true' && (needs.test-backend.result == 'success' || needs.test-backend.result == 'skipped')
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup GCP Authentication
        uses: ./.github/actions/setup-gcp-auth
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: gcr.io/${{ secrets.GCP_PROJECT_ID }}/epitrello-backend
          tags: |
            type=sha,format=long
            type=raw,value=${{ github.ref_name }}-${{ github.sha }},enable=true
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    name: Build Frontend Docker Image
    runs-on: ubuntu-latest
    needs: [detect-changes, test-frontend]
    if: needs.detect-changes.outputs.frontend == 'true' && (needs.test-frontend.result == 'success' || needs.test-frontend.result == 'skipped')
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup GCP Authentication
        uses: ./.github/actions/setup-gcp-auth
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Get Backend URL for build
        id: backend-url
        uses: ./.github/actions/get-backend-url
        with:
          environment: ${{ needs.detect-changes.outputs.environment }}
          region: ${{ env.GCP_REGION }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          production_api_url: ${{ secrets.PRODUCTION_API_URL }}
          staging_api_url: ${{ secrets.STAGING_API_URL }}

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: gcr.io/${{ secrets.GCP_PROJECT_ID }}/epitrello-frontend
          tags: |
            type=sha,format=long
            type=raw,value=${{ github.ref_name }}-${{ github.sha }},enable=true
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ steps.backend-url.outputs.url }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  run-migrations:
    name: Run Database Migrations
    runs-on: ubuntu-latest
    needs: [detect-changes, terraform]
    if: github.event_name != 'pull_request' && needs.terraform.result == 'success'
    environment: ${{ needs.detect-changes.outputs.environment }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run migrations
        uses: ./.github/actions/run-migrations
        with:
          environment: ${{ needs.detect-changes.outputs.environment }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          db_password: ${{ secrets.DB_PASSWORD }}

  deploy-backend:
    name: Deploy Backend to Cloud Run
    runs-on: ubuntu-latest
    needs: [detect-changes, build-backend, terraform, run-migrations]
    if: github.event_name != 'pull_request' && needs.detect-changes.outputs.backend == 'true' && needs.build-backend.result == 'success' && needs.terraform.result == 'success' && (needs.run-migrations.result == 'success' || needs.run-migrations.result == 'skipped')
    environment: ${{ needs.detect-changes.outputs.environment }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup GCP Authentication
        uses: ./.github/actions/setup-gcp-auth
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Deploy to Cloud Run
        run: |
          ENV=${{ needs.detect-changes.outputs.environment }}
          IMAGE_TAG="${{ github.ref_name }}-${{ github.sha }}"
          IMAGE="gcr.io/${{ secrets.GCP_PROJECT_ID }}/epitrello-backend:${IMAGE_TAG}"
          SERVICE_NAME="${ENV}-epitrello-backend"

          gcloud run services update $SERVICE_NAME \
            --image $IMAGE \
            --region ${{ env.GCP_REGION }} \
            --platform managed

  deploy-frontend:
    name: Deploy Frontend to Cloud Run
    runs-on: ubuntu-latest
    needs: [detect-changes, build-frontend, terraform]
    if: github.event_name != 'pull_request' && needs.detect-changes.outputs.frontend == 'true' && needs.build-frontend.result == 'success' && needs.terraform.result == 'success'
    environment: ${{ needs.detect-changes.outputs.environment }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup GCP Authentication
        uses: ./.github/actions/setup-gcp-auth
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Get Backend URL
        id: backend-url
        uses: ./.github/actions/get-backend-url
        with:
          environment: ${{ needs.detect-changes.outputs.environment }}
          region: ${{ env.GCP_REGION }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          production_api_url: ${{ secrets.PRODUCTION_API_URL }}
          staging_api_url: ${{ secrets.STAGING_API_URL }}

      - name: Deploy to Cloud Run
        run: |
          ENV=${{ needs.detect-changes.outputs.environment }}
          IMAGE_TAG="${{ github.ref_name }}-${{ github.sha }}"
          IMAGE="gcr.io/${{ secrets.GCP_PROJECT_ID }}/epitrello-frontend:${IMAGE_TAG}"
          SERVICE_NAME="${ENV}-epitrello-frontend"
          BACKEND_URL="${{ steps.backend-url.outputs.url }}"

          gcloud run services update $SERVICE_NAME \
            --image $IMAGE \
            --update-env-vars NEXT_PUBLIC_API_URL=$BACKEND_URL \
            --region ${{ env.GCP_REGION }} \
            --platform managed

  deploy-docs:
    name: Deploy GraphQL Documentation
    runs-on: ubuntu-latest
    needs: [detect-changes, terraform, build-backend]
    if: github.event_name != 'pull_request' && needs.terraform.result == 'success' && needs.build-backend.result == 'success'
    environment: ${{ needs.detect-changes.outputs.environment }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup GCP Authentication
        uses: ./.github/actions/setup-gcp-auth
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup Backend
        uses: ./.github/actions/setup-backend

      - name: Build application
        working-directory: backend
        run: pnpm build

      - name: Generate GraphQL schema
        working-directory: backend
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
          JWT_SECRET: dummy-secret-for-schema-generation-only
        run: |
          timeout 30 node -e "const { NestFactory } = require('@nestjs/core'); const { AppModule } = require('./dist/app.module'); (async () => { const app = await NestFactory.create(AppModule, { logger: false }); await app.close(); })().catch(() => process.exit(0));" || true

      - name: Generate GraphQL documentation
        working-directory: backend
        run: pnpm docs:generate
        continue-on-error: true

      - name: Get documentation bucket name
        id: bucket
        shell: bash
        run: |
          ENV="${{ needs.detect-changes.outputs.environment }}"
          PROJECT_ID="${{ secrets.GCP_PROJECT_ID }}"
          BUCKET_NAME="${PROJECT_ID}-${ENV}-epitrello-docs"
          echo "bucket_name=$BUCKET_NAME" >> $GITHUB_OUTPUT

      - name: Upload documentation to GCS
        if: success()
        working-directory: backend
        run: |
          BUCKET="${{ steps.bucket.outputs.bucket_name }}"
          if [ -d "docs/graphql" ]; then
            gcloud storage rsync --recursive docs/graphql/ gs://${BUCKET}/
          fi
        continue-on-error: true

  notify:
    name: Notify Deployment
    runs-on: ubuntu-latest
    needs:
      [
        detect-changes,
        terraform,
        run-migrations,
        deploy-backend,
        deploy-frontend,
        deploy-docs,
      ]
    if: always() && (needs.terraform.result == 'success' || needs.terraform.result == 'skipped') && (needs.deploy-backend.result == 'success' || needs.deploy-backend.result == 'skipped') && (needs.deploy-frontend.result == 'success' || needs.deploy-frontend.result == 'skipped')
    environment: ${{ needs.detect-changes.outputs.environment }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup GCP Authentication
        uses: ./.github/actions/setup-gcp-auth
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Get Backend URL
        id: backend-url
        uses: ./.github/actions/get-backend-url
        with:
          environment: ${{ needs.detect-changes.outputs.environment }}
          region: ${{ env.GCP_REGION }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Get Frontend URL
        id: frontend-url
        shell: bash
        run: |
          ENV="${{ needs.detect-changes.outputs.environment }}"
          SERVICE_NAME="${ENV}-epitrello-frontend"
          URL=$(gcloud run services describe $SERVICE_NAME \
            --region ${{ env.GCP_REGION }} \
            --project ${{ secrets.GCP_PROJECT_ID }} \
            --format="value(status.url)" 2>/dev/null || echo "")
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Deployment Summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Environment: ${{ needs.detect-changes.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Status | URL |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| Terraform | ${{ needs.terraform.result }} | - |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | ${{ needs.deploy-backend.result }} | ${{ steps.backend-url.outputs.url }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | ${{ needs.deploy-frontend.result }} | ${{ steps.frontend-url.outputs.url }} |" >> $GITHUB_STEP_SUMMARY
