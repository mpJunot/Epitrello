name: Deploy to GCP

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - staging
          - production

env:
  TF_VERSION: '1.6.0'
  TF_WORKING_DIR: ./terraform
  GCP_REGION: europe-west1

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      terraform: ${{ steps.filter.outputs.terraform }}
      environment: ${{ steps.env.outputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect environment
        id: env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/master" ]; then
            echo "environment=production" >> $GITHUB_OUTPUT
          else
            echo "environment=staging" >> $GITHUB_OUTPUT
          fi

      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@v2
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/deploy.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/deploy.yml'
            terraform:
              - 'terraform/**'
              - '.github/workflows/deploy.yml'

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.terraform == 'true'

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/epitrello_test?schema=public
      JWT_SECRET: test-secret-key-for-ci
      NODE_ENV: test

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: epitrello_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Backend
        uses: ./.github/actions/setup-backend

      - name: Run backend tests
        working-directory: backend
        run: pnpm test:unit

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.terraform == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Frontend
        uses: ./.github/actions/setup-frontend

      - name: Check for test script
        id: check-test
        working-directory: frontend
        run: |
          if grep -q '"test"' package.json; then
            echo "has_test=true" >> $GITHUB_OUTPUT
          else
            echo "has_test=false" >> $GITHUB_OUTPUT
          fi

      - name: Run frontend tests
        if: steps.check-test.outputs.has_test == 'true'
        working-directory: frontend
        run: pnpm test

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: detect-changes
    if: always() && (needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.frontend == 'true')
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  terraform-validate:
    name: Validate Terraform
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.terraform == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

  build-backend:
    name: Build Backend Docker Image
    runs-on: ubuntu-latest
    needs: [detect-changes, test-backend]
    if: needs.detect-changes.outputs.backend == 'true' && (needs.test-backend.result == 'success' || needs.test-backend.result == 'skipped')
    outputs:
      image: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Validate GCP credentials
        run: |
          if [ -z "${{ secrets.GCP_SA_KEY }}" ]; then
            echo "ERROR: GCP_SA_KEY secret is not set"
            exit 1
          fi

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: gcr.io/${{ secrets.GCP_PROJECT_ID }}/epitrello-backend
          tags: |
            type=sha,format=long
            type=raw,value=${{ github.ref_name }}-${{ github.sha }},enable=true
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: [detect-changes, test-frontend]
    if: needs.detect-changes.outputs.frontend == 'true' && (needs.test-frontend.result == 'success' || needs.test-frontend.result == 'skipped')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Frontend
        uses: ./.github/actions/setup-frontend

      - name: Build frontend
        working-directory: frontend
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.STAGING_API_URL || secrets.PRODUCTION_API_URL }}

      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/.next/
          retention-days: 7

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [detect-changes, terraform-validate]
    if: needs.detect-changes.outputs.terraform == 'true' && needs.terraform-validate.result == 'success'
    environment: ${{ needs.detect-changes.outputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -upgrade

      - name: Apply service account permissions first
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init -upgrade
          terraform apply -target=google_service_account.epitrello_deployer -target=google_project_iam_member.deployer_roles -auto-approve \
            -var="environment=${{ needs.detect-changes.outputs.environment }}" \
            -var="project_id=${{ secrets.GCP_PROJECT_ID }}" \
            -var="region=${{ env.GCP_REGION }}" \
            -var="db_name=${{ secrets.DB_NAME }}" \
            -var="db_user=${{ secrets.DB_USER }}" \
            -var="database_password=${{ secrets.DB_PASSWORD }}" \
            -var="backend_image=gcr.io/${{ secrets.GCP_PROJECT_ID }}/epitrello-backend:latest" \
            -var="jwt_secret=${{ secrets.JWT_SECRET }}" \
            -var="resend_api_key=${{ secrets.RESEND_API_KEY }}" \
            -var="google_client_id=${{ secrets.GOOGLE_CLIENT_ID }}" \
            -var="google_client_secret=${{ secrets.GOOGLE_CLIENT_SECRET }}" \
            -var="microsoft_client_id=${{ secrets.MICROSOFT_CLIENT_ID }}" \
            -var="microsoft_client_secret=${{ secrets.MICROSOFT_CLIENT_SECRET }}" \
            -var="apple_client_id=${{ secrets.APPLE_CLIENT_ID }}" \
            -var="apple_client_secret=${{ secrets.APPLE_CLIENT_SECRET }}" \
            -var="slack_client_id=${{ secrets.SLACK_CLIENT_ID }}" \
            -var="slack_client_secret=${{ secrets.SLACK_CLIENT_SECRET }}" \
            2>&1 | grep -v "No changes" || true
          sleep 10

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          export TF_LOG=INFO
          export TF_LOG_PATH=/tmp/terraform.log
          terraform plan -out=tfplan \
            -parallelism=10 \
            -refresh=false \
            -var="environment=${{ needs.detect-changes.outputs.environment }}" \
            -var="project_id=${{ secrets.GCP_PROJECT_ID }}" \
            -var="region=${{ env.GCP_REGION }}" \
            -var="db_name=${{ secrets.DB_NAME }}" \
            -var="db_user=${{ secrets.DB_USER }}" \
            -var="database_password=${{ secrets.DB_PASSWORD }}" \
            -var="backend_image=gcr.io/${{ secrets.GCP_PROJECT_ID }}/epitrello-backend:latest" \
            -var="jwt_secret=${{ secrets.JWT_SECRET }}" \
            -var="resend_api_key=${{ secrets.RESEND_API_KEY }}" \
            -var="google_client_id=${{ secrets.GOOGLE_CLIENT_ID }}" \
            -var="google_client_secret=${{ secrets.GOOGLE_CLIENT_SECRET }}" \
            -var="microsoft_client_id=${{ secrets.MICROSOFT_CLIENT_ID }}" \
            -var="microsoft_client_secret=${{ secrets.MICROSOFT_CLIENT_SECRET }}" \
            -var="apple_client_id=${{ secrets.APPLE_CLIENT_ID }}" \
            -var="apple_client_secret=${{ secrets.APPLE_CLIENT_SECRET }}" \
            -var="slack_client_id=${{ secrets.SLACK_CLIENT_ID }}" \
            -var="slack_client_secret=${{ secrets.SLACK_CLIENT_SECRET }}"
        timeout-minutes: 25

      - name: Save plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ needs.detect-changes.outputs.environment }}
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          retention-days: 1

  terraform-apply:
    name: Apply Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [detect-changes, terraform-plan]
    if: github.event_name != 'pull_request' && needs.detect-changes.outputs.terraform == 'true' && needs.terraform-plan.result == 'success'
    environment: ${{ needs.detect-changes.outputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-${{ needs.detect-changes.outputs.environment }}
          path: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform apply -auto-approve tfplan 2>&1 | tee /tmp/apply.log || {
            if grep -q "Saved plan is stale" /tmp/apply.log; then
              echo "Plan is stale, regenerating..."
              terraform plan -out=tfplan \
                -parallelism=10 \
                -refresh=false \
                -var="environment=${{ needs.detect-changes.outputs.environment }}" \
                -var="project_id=${{ secrets.GCP_PROJECT_ID }}" \
                -var="region=${{ env.GCP_REGION }}" \
                -var="db_name=${{ secrets.DB_NAME }}" \
                -var="db_user=${{ secrets.DB_USER }}" \
                -var="database_password=${{ secrets.DB_PASSWORD }}" \
                -var="backend_image=gcr.io/${{ secrets.GCP_PROJECT_ID }}/epitrello-backend:latest" \
                -var="jwt_secret=${{ secrets.JWT_SECRET }}" \
                -var="resend_api_key=${{ secrets.RESEND_API_KEY }}" \
                -var="google_client_id=${{ secrets.GOOGLE_CLIENT_ID }}" \
                -var="google_client_secret=${{ secrets.GOOGLE_CLIENT_SECRET }}" \
                -var="microsoft_client_id=${{ secrets.MICROSOFT_CLIENT_ID }}" \
                -var="microsoft_client_secret=${{ secrets.MICROSOFT_CLIENT_SECRET }}" \
                -var="apple_client_id=${{ secrets.APPLE_CLIENT_ID }}" \
                -var="apple_client_secret=${{ secrets.APPLE_CLIENT_SECRET }}" \
                -var="slack_client_id=${{ secrets.SLACK_CLIENT_ID }}" \
                -var="slack_client_secret=${{ secrets.SLACK_CLIENT_SECRET }}"
              echo "Applying regenerated plan..."
              terraform apply -auto-approve tfplan
            else
              echo "Apply failed with different error, see logs above"
              exit 1
            fi
          }

  deploy-backend:
    name: Deploy Backend to Cloud Run
    runs-on: ubuntu-latest
    needs: [detect-changes, build-backend, terraform-apply]
    if: github.event_name != 'pull_request' && needs.detect-changes.outputs.backend == 'true' && needs.build-backend.result == 'success' && needs.terraform-apply.result == 'success'
    environment: ${{ needs.detect-changes.outputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Validate GCP credentials
        run: |
          if [ -z "${{ secrets.GCP_SA_KEY }}" ]; then
            echo "ERROR: GCP_SA_KEY secret is not set"
            exit 1
          fi

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy to Cloud Run
        run: |
          ENV=${{ needs.detect-changes.outputs.environment }}
          IMAGE_TAG="${{ github.ref_name }}-${{ github.sha }}"
          IMAGE="gcr.io/${{ secrets.GCP_PROJECT_ID }}/epitrello-backend:${IMAGE_TAG}"
          SERVICE_NAME="${ENV}-epitrello-backend"

          echo "Deploying image: $IMAGE"
          echo "Service: $SERVICE_NAME"

          gcloud run services update $SERVICE_NAME \
            --image $IMAGE \
            --region ${{ env.GCP_REGION }} \
            --platform managed

  deploy-frontend:
    name: Deploy Frontend to App Engine
    runs-on: ubuntu-latest
    needs: [detect-changes, build-frontend, terraform-apply]
    if: github.event_name != 'pull_request' && needs.detect-changes.outputs.frontend == 'true' && needs.build-frontend.result == 'success' && needs.terraform-apply.result == 'success'
    environment: ${{ needs.detect-changes.outputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Validate GCP credentials
        run: |
          if [ -z "${{ secrets.GCP_SA_KEY }}" ]; then
            echo "ERROR: GCP_SA_KEY secret is not set"
            exit 1
          fi

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Verify App Engine application exists
        run: |
          if ! gcloud app describe --project=${{ secrets.GCP_PROJECT_ID }} > /dev/null 2>&1; then
            echo "ERROR: App Engine application does not exist. It should be created by Terraform."
            echo "Please ensure terraform-apply job completed successfully and created the App Engine application."
            exit 1
          fi

      - name: Setup Frontend
        uses: ./.github/actions/setup-frontend

      - name: Download build artifacts
        id: download-artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/.next/
        continue-on-error: true

      - name: Check if build artifacts exist and build if missing
        run: |
          # Ensure pnpm is in PATH
          export PATH="$PNPM_HOME:$PATH"
          if ! command -v pnpm &> /dev/null; then
            echo "ERROR: pnpm is not available in PATH"
            echo "PNPM_HOME: $PNPM_HOME"
            echo "PATH: $PATH"
            exit 1
          fi

          # Check if artifacts were downloaded successfully
          ARTIFACT_EXISTS=false
          if [ -d "frontend/.next" ] && [ -n "$(ls -A frontend/.next 2>/dev/null)" ]; then
            ARTIFACT_EXISTS=true
          fi

          if [ "$ARTIFACT_EXISTS" = "false" ]; then
            cd frontend
            pnpm build
            cd ..
          fi
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.STAGING_API_URL || secrets.PRODUCTION_API_URL }}

      - name: Get Backend URL
        id: backend-url
        run: |
          ENV=${{ needs.detect-changes.outputs.environment }}
          SERVICE_NAME="${ENV}-epitrello-backend"
          URL=$(gcloud run services describe $SERVICE_NAME \
            --region ${{ env.GCP_REGION }} \
            --format="value(status.url)" 2>/dev/null || echo "")
          if [ -z "$URL" ]; then
            if [ "$ENV" == "production" ]; then
              URL="${{ secrets.PRODUCTION_API_URL }}"
            else
              URL="${{ secrets.STAGING_API_URL }}"
            fi
            if [ -z "$URL" ]; then
              echo "ERROR: Backend URL is not available from Cloud Run or secrets"
              exit 1
            fi
          fi
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Update app.yaml with API URL
        working-directory: frontend
        run: |
          ENV=${{ needs.detect-changes.outputs.environment }}
          API_URL="${{ steps.backend-url.outputs.url }}"
          if [ -z "$API_URL" ]; then
            echo "ERROR: Backend URL is not set"
            exit 1
          fi
          printf 'runtime: nodejs20\n\nenv: standard\n\ninstance_class: F2\n\nautomatic_scaling:\n  min_instances: 0\n  max_instances: 10\n  target_cpu_utilization: 0.6\n  target_throughput_utilization: 0.6\n\nenv_variables:\n  NODE_ENV: production\n  NEXT_PUBLIC_API_URL: '\''%s'\''\n\nhandlers:\n  - url: /.*\n    script: auto\n    secure: always\n' "$API_URL" > app.yaml

      - name: Deploy to App Engine
        working-directory: frontend
        run: |
          ENV=${{ needs.detect-changes.outputs.environment }}
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          VERSION="${ENV}-${SHORT_SHA}"
          gcloud app deploy app.yaml \
            --version=${VERSION} \
            --no-promote

  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    if: (needs.deploy-backend.result == 'success' || needs.deploy-backend.result == 'skipped') && (needs.deploy-frontend.result == 'success' || needs.deploy-frontend.result == 'skipped')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run smoke tests
        run: |
          # Add actual smoke tests here
          # curl -f ${{ secrets.STAGING_API_URL }}/health || exit 1

  notify:
    name: Notify Deployment
    runs-on: ubuntu-latest
    needs:
      [
        detect-changes,
        terraform-apply,
        deploy-backend,
        deploy-frontend,
        smoke-tests,
      ]
    if: always() && (needs.terraform-apply.result == 'success' || needs.terraform-apply.result == 'skipped') && (needs.deploy-backend.result == 'success' || needs.deploy-backend.result == 'skipped') && (needs.deploy-frontend.result == 'success' || needs.deploy-frontend.result == 'skipped')
    environment: ${{ needs.detect-changes.outputs.environment }}

    steps:
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Validate GCP credentials
        run: |
          if [ -z "${{ secrets.GCP_SA_KEY }}" ]; then
            echo "ERROR: GCP_SA_KEY secret is not set"
            exit 1
          fi

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Get Backend URL
        id: backend-url
        run: |
          ENV=${{ needs.detect-changes.outputs.environment }}
          SERVICE_NAME="${ENV}-epitrello-backend"
          URL=$(gcloud run services describe $SERVICE_NAME \
            --region ${{ env.GCP_REGION }} \
            --format="value(status.url)" 2>/dev/null || echo "")
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Get Frontend URL
        id: frontend-url
        run: |
          ENV=${{ needs.detect-changes.outputs.environment }}
          PROJECT_ID="${{ secrets.GCP_PROJECT_ID }}"
          if [ "$ENV" == "production" ]; then
            URL="https://${PROJECT_ID}.appspot.com"
          else
            URL="https://${ENV}-dot-${PROJECT_ID}.appspot.com"
          fi
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Deployment Summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Environment: ${{ needs.detect-changes.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Status | URL |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| Terraform | ${{ needs.terraform-apply.result }} | - |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | ${{ needs.deploy-backend.result }} | ${{ steps.backend-url.outputs.url }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | ${{ needs.deploy-frontend.result }} | ${{ steps.frontend-url.outputs.url }} |" >> $GITHUB_STEP_SUMMARY

      - name: Deployment status
        run: |
          echo "Terraform: ${{ needs.terraform-apply.result }}"
          echo "Backend: ${{ needs.deploy-backend.result }}"
          echo "Frontend: ${{ needs.deploy-frontend.result }}"
