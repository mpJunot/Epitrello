name: Deploy to GCP

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - staging
          - production

env:
  TF_VERSION: '1.6.0'
  TF_WORKING_DIR: ./terraform
  GCP_REGION: europe-west1

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      terraform: ${{ steps.filter.outputs.terraform }}
      environment: ${{ steps.env.outputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect environment
        id: env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/master" ]; then
            echo "environment=production" >> $GITHUB_OUTPUT
          else
            echo "environment=staging" >> $GITHUB_OUTPUT
          fi

      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/deploy.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/deploy.yml'
            terraform:
              - 'terraform/**'
              - '.github/workflows/deploy.yml'

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: changes
    if: always() && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true')
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  terraform-validate:
    name: Validate Terraform
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.terraform == 'true' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

  build-backend:
    name: Build Backend Docker Image
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup GCP Authentication
        uses: ./.github/actions/setup-gcp-auth
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: gcr.io/${{ secrets.GCP_PROJECT_ID }}/epitrello-backend
          tags: |
            type=sha,format=long
            type=raw,value=${{ github.ref_name }}-${{ github.sha }},enable=true
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    name: Build Frontend Docker Image
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true'
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup GCP Authentication
        uses: ./.github/actions/setup-gcp-auth
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Get Backend URL for build
        id: backend-url
        uses: ./.github/actions/get-backend-url
        with:
          environment: ${{ needs.changes.outputs.environment }}
          region: ${{ env.GCP_REGION }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          production_api_url: ${{ secrets.PRODUCTION_API_URL }}
          staging_api_url: ${{ secrets.STAGING_API_URL }}

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: gcr.io/${{ secrets.GCP_PROJECT_ID }}/epitrello-frontend
          tags: |
            type=sha,format=long
            type=raw,value=${{ github.ref_name }}-${{ github.sha }},enable=true
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ steps.backend-url.outputs.url }}/graphql
          cache-from: type=gha
          cache-to: type=gha,mode=max

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes, terraform-validate]
    if: github.event_name != 'pull_request' && (needs.changes.outputs.terraform == 'true' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true') && needs.terraform-validate.result == 'success'
    environment: ${{ needs.changes.outputs.environment }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Setup GCP Authentication
        uses: ./.github/actions/setup-gcp-auth
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Get Backend URL for callback URLs
        id: backend-url-callbacks
        uses: ./.github/actions/get-backend-url
        with:
          environment: ${{ needs.changes.outputs.environment }}
          region: ${{ env.GCP_REGION }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          production_api_url: ${{ secrets.PRODUCTION_API_URL }}
          staging_api_url: ${{ secrets.STAGING_API_URL }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init -upgrade -reconfigure \
            -backend-config="prefix=terraform/state/${{ needs.changes.outputs.environment }}"

      - name: Setup Terraform variables
        uses: ./.github/actions/setup-terraform-vars
        with:
          environment: ${{ needs.changes.outputs.environment }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          region: ${{ env.GCP_REGION }}
          db_name: ${{ secrets.DB_NAME }}
          db_user: ${{ secrets.DB_USER }}
          db_password: ${{ secrets.DB_PASSWORD }}
          jwt_secret: ${{ secrets.JWT_SECRET }}
          resend_api_key: ${{ secrets.RESEND_API_KEY }}
          google_client_id: ${{ secrets.GOOGLE_CLIENT_ID }}
          google_client_secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          microsoft_client_id: ${{ secrets.MICROSOFT_CLIENT_ID }}
          microsoft_client_secret: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          github_client_id: ${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
          github_client_secret: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
          slack_client_id: ${{ secrets.SLACK_CLIENT_ID }}
          slack_client_secret: ${{ secrets.SLACK_CLIENT_SECRET }}
          google_callback_url: ${{ steps.backend-url-callbacks.outputs.url }}/auth/google/callback
          microsoft_callback_url: ${{ steps.backend-url-callbacks.outputs.url }}/auth/microsoft/callback
          github_callback_url: ${{ steps.backend-url-callbacks.outputs.url }}/auth/github/callback
          slack_callback_url: ${{ steps.backend-url-callbacks.outputs.url }}/auth/slack/callback

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          export TF_LOG=INFO
          export TF_LOG_PATH=/tmp/terraform.log
          source /tmp/terraform_vars.sh
          terraform plan -out=tfplan \
            -parallelism=10 \
            -refresh=false \
            "${TF_VARS[@]}"
        timeout-minutes: 25

      - name: Save plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ needs.changes.outputs.environment }}
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          retention-days: 1

  terraform-apply:
    name: Apply Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes, terraform-plan]
    if: github.event_name != 'pull_request' && (needs.changes.outputs.terraform == 'true' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true') && needs.terraform-plan.result == 'success'
    environment: ${{ needs.changes.outputs.environment }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Setup GCP Authentication
        uses: ./.github/actions/setup-gcp-auth
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Get Backend URL for callback URLs
        id: backend-url-callbacks
        uses: ./.github/actions/get-backend-url
        with:
          environment: ${{ needs.changes.outputs.environment }}
          region: ${{ env.GCP_REGION }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          production_api_url: ${{ secrets.PRODUCTION_API_URL }}
          staging_api_url: ${{ secrets.STAGING_API_URL }}

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-${{ needs.changes.outputs.environment }}
          path: ${{ env.TF_WORKING_DIR }}

      - name: Validate required secrets
        shell: bash
        run: |
          if [ -z "${{ secrets.DB_NAME }}" ]; then
            echo "ERROR: DB_NAME secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.DB_USER }}" ]; then
            echo "ERROR: DB_USER secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.DB_PASSWORD }}" ]; then
            echo "ERROR: DB_PASSWORD secret is not set"
            exit 1
          fi

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init -reconfigure \
            -backend-config="prefix=terraform/state/${{ needs.changes.outputs.environment }}"

      - name: Setup Terraform variables
        uses: ./.github/actions/setup-terraform-vars
        with:
          environment: ${{ needs.changes.outputs.environment }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          region: ${{ env.GCP_REGION }}
          db_name: ${{ secrets.DB_NAME }}
          db_user: ${{ secrets.DB_USER }}
          db_password: ${{ secrets.DB_PASSWORD }}
          jwt_secret: ${{ secrets.JWT_SECRET }}
          resend_api_key: ${{ secrets.RESEND_API_KEY }}
          google_client_id: ${{ secrets.GOOGLE_CLIENT_ID }}
          google_client_secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          microsoft_client_id: ${{ secrets.MICROSOFT_CLIENT_ID }}
          microsoft_client_secret: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          github_client_id: ${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
          github_client_secret: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
          slack_client_id: ${{ secrets.SLACK_CLIENT_ID }}
          slack_client_secret: ${{ secrets.SLACK_CLIENT_SECRET }}
          google_callback_url: ${{ steps.backend-url-callbacks.outputs.url }}/auth/google/callback
          microsoft_callback_url: ${{ steps.backend-url-callbacks.outputs.url }}/auth/microsoft/callback
          github_callback_url: ${{ steps.backend-url-callbacks.outputs.url }}/auth/github/callback
          slack_callback_url: ${{ steps.backend-url-callbacks.outputs.url }}/auth/slack/callback

      - name: Import existing Terraform state bucket if needed
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          source /tmp/terraform_vars.sh
          if ! terraform state show google_storage_bucket.terraform_state >/dev/null 2>&1; then
            terraform import "${TF_VARS[@]}" \
              google_storage_bucket.terraform_state epitrello-terraform-state 2>/dev/null || true
          fi

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          source /tmp/terraform_vars.sh
          terraform apply -auto-approve tfplan 2>&1 | tee /tmp/apply.log || {
            if grep -q "Saved plan is stale" /tmp/apply.log; then
              terraform refresh "${TF_VARS[@]}" || true
              terraform plan -out=tfplan -parallelism=10 -refresh=true "${TF_VARS[@]}"
              terraform apply -auto-approve tfplan || exit 1
            elif grep -q "Your previous request to create the named bucket succeeded" /tmp/apply.log; then
              terraform import "${TF_VARS[@]}" \
                google_storage_bucket.terraform_state epitrello-terraform-state || true
              terraform apply -auto-approve tfplan || exit 1
            else
              exit 1
            fi
          }

  run-migrations:
    name: Run Database Migrations
    runs-on: ubuntu-latest
    needs: [changes, terraform-apply]
    if: github.event_name != 'pull_request' && needs.terraform-apply.result == 'success'
    environment: ${{ needs.changes.outputs.environment }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run migrations
        uses: ./.github/actions/run-migrations
        with:
          environment: ${{ needs.changes.outputs.environment }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          db_password: ${{ secrets.DB_PASSWORD }}
          db_name: ${{ secrets.DB_NAME }}
          db_user: ${{ secrets.DB_USER }}

  deploy-backend:
    name: Deploy Backend to Cloud Run
    runs-on: ubuntu-latest
    needs: [changes, build-backend, terraform-apply, run-migrations]
    if: github.event_name != 'pull_request' && needs.changes.outputs.backend == 'true' && needs.build-backend.result == 'success' && needs.terraform-apply.result == 'success' && needs.run-migrations.result == 'success'
    environment: ${{ needs.changes.outputs.environment }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup GCP Authentication
        uses: ./.github/actions/setup-gcp-auth
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Get Frontend URL
        id: frontend-url
        shell: bash
        run: |
          ENV=${{ needs.changes.outputs.environment }}
          SERVICE_NAME="${ENV}-epitrello-frontend"
          URL=$(gcloud run services describe $SERVICE_NAME \
            --region ${{ env.GCP_REGION }} \
            --project ${{ secrets.GCP_PROJECT_ID }} \
            --format="value(status.url)" 2>/dev/null || echo "")
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "Frontend URL: $URL"

      - name: Deploy to Cloud Run
        run: |
          ENV=${{ needs.changes.outputs.environment }}
          IMAGE_TAG="${{ github.ref_name }}-${{ github.sha }}"
          IMAGE="gcr.io/${{ secrets.GCP_PROJECT_ID }}/epitrello-backend:${IMAGE_TAG}"
          SERVICE_NAME="${ENV}-epitrello-backend"
          FRONTEND_URL="${{ steps.frontend-url.outputs.url }}"

          if [ -n "$FRONTEND_URL" ]; then
            echo "Updating backend with frontend URL: $FRONTEND_URL"
            gcloud run services update $SERVICE_NAME \
              --image $IMAGE \
              --update-env-vars FRONTEND_URL=$FRONTEND_URL \
              --region ${{ env.GCP_REGION }} \
              --platform managed
          else
            echo "Warning: Frontend URL not available, deploying without FRONTEND_URL update"
            gcloud run services update $SERVICE_NAME \
              --image $IMAGE \
              --region ${{ env.GCP_REGION }} \
              --platform managed
          fi

  deploy-frontend:
    name: Deploy Frontend to Cloud Run
    runs-on: ubuntu-latest
    needs: [changes, build-frontend, terraform-apply]
    if: github.event_name != 'pull_request' && needs.changes.outputs.frontend == 'true' && needs.build-frontend.result == 'success' && needs.terraform-apply.result == 'success'
    environment: ${{ needs.changes.outputs.environment }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup GCP Authentication
        uses: ./.github/actions/setup-gcp-auth
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Get Backend URL
        id: backend-url
        uses: ./.github/actions/get-backend-url
        with:
          environment: ${{ needs.changes.outputs.environment }}
          region: ${{ env.GCP_REGION }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          production_api_url: ${{ secrets.PRODUCTION_API_URL }}
          staging_api_url: ${{ secrets.STAGING_API_URL }}

      - name: Get Frontend URL
        id: frontend-url
        shell: bash
        run: |
          ENV=${{ needs.changes.outputs.environment }}
          SERVICE_NAME="${ENV}-epitrello-frontend"
          URL=$(gcloud run services describe $SERVICE_NAME \
            --region ${{ env.GCP_REGION }} \
            --project ${{ secrets.GCP_PROJECT_ID }} \
            --format="value(status.url)" 2>/dev/null || echo "")
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "Frontend URL: $URL"

      - name: Deploy to Cloud Run
        run: |
          ENV=${{ needs.changes.outputs.environment }}
          IMAGE_TAG="${{ github.ref_name }}-${{ github.sha }}"
          IMAGE="gcr.io/${{ secrets.GCP_PROJECT_ID }}/epitrello-frontend:${IMAGE_TAG}"
          SERVICE_NAME="${ENV}-epitrello-frontend"
          BACKEND_URL="${{ steps.backend-url.outputs.url }}"

          gcloud run services update $SERVICE_NAME \
            --image $IMAGE \
            --update-env-vars NEXT_PUBLIC_API_URL=$BACKEND_URL \
            --region ${{ env.GCP_REGION }} \
            --platform managed

      - name: Update Backend with Frontend URL
        run: |
          ENV=${{ needs.changes.outputs.environment }}
          BACKEND_SERVICE_NAME="${ENV}-epitrello-backend"
          FRONTEND_URL="${{ steps.frontend-url.outputs.url }}"

          if [ -n "$FRONTEND_URL" ]; then
            echo "Updating backend with frontend URL: $FRONTEND_URL"
            gcloud run services update $BACKEND_SERVICE_NAME \
              --update-env-vars FRONTEND_URL=$FRONTEND_URL \
              --region ${{ env.GCP_REGION }} \
              --platform managed
          else
            echo "Warning: Frontend URL not available, skipping backend update"
          fi

  deploy-docs:
    name: Deploy GraphQL Documentation
    runs-on: ubuntu-latest
    needs: [changes, terraform-apply, build-backend]
    if: github.event_name != 'pull_request' && needs.terraform-apply.result == 'success' && needs.build-backend.result == 'success'
    environment: ${{ needs.changes.outputs.environment }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup GCP Authentication
        uses: ./.github/actions/setup-gcp-auth
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup Backend
        uses: ./.github/actions/setup-backend

      - name: Build application
        working-directory: backend
        run: pnpm build

      - name: Generate GraphQL schema
        working-directory: backend
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
          JWT_SECRET: dummy-secret-for-schema-generation-only
        run: |
          timeout 30 node -e "const { NestFactory } = require('@nestjs/core'); const { AppModule } = require('./dist/app.module'); (async () => { const app = await NestFactory.create(AppModule, { logger: false }); await app.close(); })().catch(() => process.exit(0));" || true

      - name: Generate GraphQL documentation
        working-directory: backend
        run: pnpm docs:generate
        continue-on-error: true

      - name: Get documentation bucket name
        id: bucket
        shell: bash
        run: |
          ENV="${{ needs.changes.outputs.environment }}"
          PROJECT_ID="${{ secrets.GCP_PROJECT_ID }}"
          BUCKET_NAME="${PROJECT_ID}-${ENV}-epitrello-docs"
          echo "bucket_name=$BUCKET_NAME" >> $GITHUB_OUTPUT

      - name: Upload documentation to GCS
        if: success()
        working-directory: backend
        run: |
          BUCKET="${{ steps.bucket.outputs.bucket_name }}"
          if [ -d "docs/graphql" ]; then
            gcloud storage rsync --recursive docs/graphql/ gs://${BUCKET}/
          fi
        continue-on-error: true

  notify:
    name: Notify Deployment
    runs-on: ubuntu-latest
    needs: [changes, deploy-backend, deploy-frontend, deploy-docs]
    if: always() && needs.deploy-backend.result == 'success' && needs.deploy-frontend.result == 'success'
    environment: ${{ needs.changes.outputs.environment }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup GCP Authentication
        uses: ./.github/actions/setup-gcp-auth
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Get Backend URL
        id: backend-url
        uses: ./.github/actions/get-backend-url
        with:
          environment: ${{ needs.changes.outputs.environment }}
          region: ${{ env.GCP_REGION }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Get Frontend URL
        id: frontend-url
        shell: bash
        run: |
          ENV="${{ needs.changes.outputs.environment }}"
          SERVICE_NAME="${ENV}-epitrello-frontend"
          URL=$(gcloud run services describe $SERVICE_NAME \
            --region ${{ env.GCP_REGION }} \
            --project ${{ secrets.GCP_PROJECT_ID }} \
            --format="value(status.url)" 2>/dev/null || echo "")
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "Frontend URL: $URL"

      - name: Deployment Summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Environment: ${{ needs.changes.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Status | URL |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| Terraform | ${{ needs.terraform-apply.result }} | - |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | ${{ needs.deploy-backend.result }} | ${{ steps.backend-url.outputs.url }} |" >> $GITHUB_STEP_SUMMARY
