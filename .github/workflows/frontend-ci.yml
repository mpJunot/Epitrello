name: Frontend CI

on:
  push:
    branches: [master, dev]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
      - '.github/actions/setup-frontend/**'
  pull_request:
    branches: [master, dev]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
      - '.github/actions/setup-frontend/**'

jobs:
  lint-and-build:
    name: Lint and Build
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_API_URL: http://localhost:4000/graphql

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Frontend
        uses: ./.github/actions/setup-frontend

      - name: Lint
        working-directory: frontend
        run: pnpm lint

      - name: Type Check
        working-directory: frontend
        run: pnpm tsc --noEmit || true

      - name: Build
        working-directory: frontend
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/graphql

      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/.next/
          retention-days: 7

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/epitrello_test?schema=public
      JWT_SECRET: test-secret-key-for-ci
      NODE_ENV: test
      NEXT_PUBLIC_API_URL: http://localhost:4000/graphql
      FRONTEND_URL: http://localhost:3000
      PLAYWRIGHT_TEST_BASE_URL: http://localhost:3000
      EMAIL_FROM: test@epitrello.com
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: epitrello_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Backend
        uses: ./.github/actions/setup-backend

      - name: Setup Frontend
        uses: ./.github/actions/setup-frontend

      - name: Run E2E tests
        run: |
          chmod +x ./frontend/e2e/scripts/run-e2e.sh
          ./frontend/e2e/scripts/run-e2e.sh

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/e2e/playwright-report/
          retention-days: 7
