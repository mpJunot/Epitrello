name: Frontend CI

on:
  push:
    branches: [master, dev]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
      - '.github/actions/setup-frontend/**'
  pull_request:
    branches: [master, dev]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
      - '.github/actions/setup-frontend/**'

jobs:
  lint-and-build:
    name: Lint and Build
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_API_URL: http://localhost:4000/graphql

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Frontend
        uses: ./.github/actions/setup-frontend

      - name: Lint
        working-directory: frontend
        run: pnpm lint

      - name: Type Check
        working-directory: frontend
        run: pnpm tsc --noEmit || true

      - name: Build
        working-directory: frontend
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/graphql

      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/.next/
          retention-days: 7

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Frontend
        uses: ./.github/actions/setup-frontend

      - name: Run unit tests
        working-directory: frontend
        run: pnpm test --passWithNoTests || echo "No tests found"

      - name: Upload coverage
        if: hashFiles('frontend/coverage/lcov.info') != ''
        uses: codecov/codecov-action@v4
        with:
          files: ./frontend/coverage/lcov.info
          flags: frontend,unittests
          name: frontend-unit-tests
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
