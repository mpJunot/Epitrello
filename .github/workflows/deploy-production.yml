name: Deploy Production

on:
  push:
    branches: [master]
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy'
        required: false

jobs:
  verify-tests:
    name: Verify All Tests Pass
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/epitrello_test?schema=public
      JWT_SECRET: test-secret-key-for-ci
      NODE_ENV: test

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: epitrello_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Backend
        uses: ./.github/actions/setup-backend

      - name: Run all backend tests
        working-directory: backend
        run: |
          pnpm test:unit:cov
          pnpm test:integration
          pnpm test:e2e

  deploy-backend:
    name: Deploy Backend to Production
    runs-on: ubuntu-latest
    environment: production
    needs: [verify-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Backend
        uses: ./.github/actions/setup-backend

      - name: Build backend
        working-directory: backend
        run: pnpm build

      # TODO: Add your production deployment steps here
      # Examples:
      # - Deploy to AWS ECS
      # - Deploy to Google Cloud Run
      # - Deploy to Railway
      # - Deploy to Render
      # - Build and push Docker image

      - name: Placeholder for production deployment
        run: |
          echo "Deploying backend to PRODUCTION..."
          echo "Version: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          # Add actual deployment commands here

  deploy-frontend:
    name: Deploy Frontend to Production
    runs-on: ubuntu-latest
    environment: production
    needs: [deploy-backend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Frontend
        uses: ./.github/actions/setup-frontend

      - name: Build frontend
        working-directory: frontend
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.PRODUCTION_API_URL }}

      # TODO: Add your production deployment steps here
      # Examples:
      # - Deploy to Vercel
      # - Deploy to Netlify
      # - Deploy to AWS S3 + CloudFront
      # - Build and push Docker image

      - name: Placeholder for production deployment
        run: |
          echo "Deploying frontend to PRODUCTION..."
          echo "Version: ${{ github.ref_name }}"
          echo "API URL: ${{ secrets.PRODUCTION_API_URL }}"
          # Add actual deployment commands here

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            ## Release ${{ github.ref_name }}

            ### Changes
            - Backend deployed to production
            - Frontend deployed to production

            ### Deployment Details
            - Backend commit: ${{ github.sha }}
            - Frontend commit: ${{ github.sha }}
            - Deployed at: ${{ github.event.head_commit.timestamp }}
          generate_release_notes: true

  notify:
    name: Notify Deployment
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    if: always()

    steps:
      - name: Deployment status
        run: |
          if [ "${{ needs.deploy-backend.result }}" == "success" ] && [ "${{ needs.deploy-frontend.result }}" == "success" ]; then
            echo "Production deployment completed successfully"
          else
            echo "Production deployment failed"
            exit 1
          fi
          echo "Backend: ${{ needs.deploy-backend.result }}"
          echo "Frontend: ${{ needs.deploy-frontend.result }}"
          # Add Slack/Discord notification here if needed
