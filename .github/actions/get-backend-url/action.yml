name: 'Get Backend URL'
description: 'Get backend Cloud Run service URL with fallback to secrets'

inputs:
  environment:
    description: 'Environment'
    required: true
  region:
    description: 'GCP Region'
    required: true
    default: 'europe-west1'
  project_id:
    description: 'GCP Project ID'
    required: false
  staging_api_url:
    description: 'Staging API URL (fallback)'
    required: false

outputs:
  url:
    description: 'Backend service URL'
    value: ${{ steps.url.outputs.url }}

runs:
  using: 'composite'
  steps:
    - name: Get Backend URL
      id: url
      shell: bash
      run: |
        ENV="${{ inputs.environment }}"
        SERVICE_NAME="${ENV}-epitrello-backend"
        REGION="${{ inputs.region }}"
        PROJECT_ID="${{ inputs.project_id }}"

        URL=""
        if [ -n "${PROJECT_ID}" ]; then
          URL=$(gcloud run services describe "$SERVICE_NAME" \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --format="value(status.url)" 2>&1) || true
        else
          URL=$(gcloud run services describe "$SERVICE_NAME" \
            --region "$REGION" \
            --format="value(status.url)" 2>&1) || true
        fi

        # Trim whitespace; if gcloud output contains error message, treat as empty
        URL=$(echo "$URL" | tr -d '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
        case "$URL" in
          https://*) ;;
          *) URL="" ;;
        esac

        if [ -z "$URL" ] && [ -n "${{ inputs.staging_api_url }}" ]; then
          URL="${{ inputs.staging_api_url }}"
        fi

        if [ -z "$URL" ]; then
          REGION_SUFFIX="$REGION"
          case "$REGION_SUFFIX" in
            europe-west1) REGION_SUFFIX="ew" ;;
            us-central1)  REGION_SUFFIX="uc" ;;
            *) REGION_SUFFIX=$(echo "$REGION_SUFFIX" | sed 's/-[a-z]*$//' | tr -d '-') ;;
          esac
          URL="https://${SERVICE_NAME}-placeholder-${REGION_SUFFIX}.a.run.app"
          echo "::warning::Backend service not found and no secret set. Using placeholder URL. After first deploy, set STAGING_API_URL in GitHub secrets with the real URL from GCP Console, then re-run to update OAuth callbacks."
        fi

        echo "url=$URL" >> $GITHUB_OUTPUT
        echo "Backend URL: $URL"
